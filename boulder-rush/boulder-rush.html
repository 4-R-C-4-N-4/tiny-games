<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BOULDER-RUSH — outrun it</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;height:100%;overflow:hidden;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0b0e14;max-width:100vw;max-height:100vh;touch-action:none;cursor:crosshair;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="540" height="960"></canvas></div>
<script>
"use strict";
/* ============================================================
   BOULDER-RUSH — an endless chase down a stone canyon.
   Touchstone: Crash Bandicoot's boulder chase. Parity list lives
   in BOULDER-RUSH-INTENT.md; build toward it before diverging.

   THE FEEL CONTRACT (non-negotiable):
   F1. Pointer-to-player latency <= 1 sim tick; steering critically
       damped - no overshoot, no jitter.
   F2. Jump is a fixed, buffered arc (tap >= 1 frame registers).
       No double jump.
   F3. 60Hz fixed-timestep sim; rendering never gates input.
   F4. Boulder pressure is always legible (a function of the gap):
       scale + rumble + shake - readable in one glance.
   F5. Obstacles slow, only the boulder kills. No instant deaths
       from the course.
   F6. Camera fixed; the road does the motion. No lateral camera
       movement.
   ============================================================ */

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const VW=540, VH=960, CX=VW/2;
/* one smooth projective mapping for EVERYTHING on the track — no
   piecewise kinks, no modulo popping. y = HORIZON + A/(CAMD+LEAD-rel).
   Downhill framing (touchstone: Crash 2's Un-Bearable): terrain fills
   the whole frame (no sky), the runner sits mid-frame with generous
   revealed track below, and the pursuer looms visually ABOVE them —
   the camera reads as high and tilted down the slope. */
const HORIZON=70, BOTTOM=VH+40, CAMD=17;

/* ---------------- seeded RNG (state randomness only) ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SEED=(()=>{const m=location.search.match(/[?&]seed=(\d+)/);return m?(+m[1]>>>0):((Date.now()^(Math.random()*4294967296))>>>0);})();
const rng=mulberry32(SEED);
function ri(a,b){return a+Math.floor(rng()*(b-a+1));}

/* ---------------- tuned constants (hang off F1-F6) ---------------- */
/* z is metres. 60Hz. Fairness floors are NUMBERS (see intent doc §8):
   reveal-to-arrival = LEAD/spd >= 42f (700ms) even at SPD_MAX;
   lunge telegraph ROAR_T = 32f (533ms) >= 500ms;
   gap floor without a recent stumble = GAP_FLOOR. */
const LEAD=14, BEHIND=30;
const SPD0=0.26, SPD_MAX=0.33, RAMP_Z=1100;         // F-floor: 14/0.33 = 42.4f
const STEER_K=0.28, PW=0.16;                        // F1/F2: exp approach never overshoots
const JUMP_T=24, JUMP_BUF=6, AIR_LO=4, AIR_HI=20;   // airborne clearance window
const GAP0=22, GAP_FLOOR=6, CATCH=1.2, STUMBLE_WIN=240;
const ROAR_T=32, LUNGE_GAP=4.5, GAPMIN=0.40;
const STUMBLE_T=50, PIT_STUMBLE_T=62, INVULN_T=70;

/* ---------------- state ---------------- */
const p={x:0,tx:0,z:0,air:0,buf:0,stumble:0,invuln:0,dead:false,anim:0};
let spd=SPD0, gap=GAP0, bSpd=SPD0, roll=0;
let started=false, paused=false, perf=0, bolts=0, shake=0;
let lungeState=0, lungeT=0, nextLunge=0, lastStumble=-9999, heat=0;
const rows=[], picks=[], parts=[];
let nextZ=18, nextBolt=30;
let best=0; try{best=+localStorage.getItem("boulder-rush-best")||0;}catch(e){}

/* ---------------- projection (F6: fixed camera) ----------------
   World scrolls up-screen. rel = ob.z - p.z:
   rel = LEAD    -> bottom edge (about to be revealed, nearest camera)
   rel = 0       -> the player row
   rel -> -inf   -> approaches the horizon. The boulder lives at rel=-gap.
   True 1/distance projection: continuous and smooth over the whole range. */
const PROJ_A=(BOTTOM-HORIZON)*CAMD;
function yOf(rel){ return HORIZON + PROJ_A/(CAMD+LEAD-Math.min(rel,LEAD)); }
const PLAYER_Y=yOf(0);
function scaleOf(y){ return Math.min(1.45, 0.15+0.85*(y-HORIZON)/(PLAYER_Y-HORIZON)); }
function hwOf(y){ return 10+(y-HORIZON)/(BOTTOM-HORIZON)*330; }

/* ---------------- course grammar (Phase 0 substrate) ----------------
   Every row must be passable BY CONSTRUCTION: rows containing
   non-jumpable totems always leave a lateral gap >= GAPMIN; everything
   else is jumpable. The director (Phase 1+) only turns these knobs. */
function intensity(z){ return Math.min(1,z/RAMP_Z); }
function knobs(z){
  const q=intensity(z);
  return {q, spacing:13.5-6*q, totemChance:0.18+0.22*q, boltRate:0.30, rockMax:q>0.55?3:2};
}
function spawnRow(z){
  const k=knobs(z), r=rng(), obs=[];
  if(r<k.totemChance){                       // totems: steer-only, gap guaranteed
    const gapW=Math.max(GAPMIN,0.50-0.08*k.q), gc=(rng()*1.1-0.55);
    const L=gc-gapW/2-0.15, R=gc+gapW/2+0.15;
    if(L>-1.05) obs.push({x:Math.max(-0.85,L),w:0.30,type:"totem"});
    if(R<1.05)  obs.push({x:Math.min(0.85,R),w:0.30,type:"totem"});
    if(!obs.length) obs.push({x:gc>0?-0.7:0.7,w:0.30,type:"totem"});
  }
  else if(r<k.totemChance+0.22) obs.push({x:0,w:2.4,type:"wall"});      // jump it
  else if(r<k.totemChance+0.40) obs.push({x:(rng()*0.8-0.4),w:0.95,type:"crack"}); // jump or go around
  else{                                       // rocks: jumpable lumps
    const n=ri(1,k.rockMax), used=[];
    for(let i=0;i<n;i++){ let x,tries=0; do{x=rng()*1.7-0.85;tries++;}while(tries<9&&used.some(u=>Math.abs(u-x)<0.55)); used.push(x); obs.push({x,w:0.34,type:"rock"}); }
  }
  rows.push({z,obs,passed:false,crushed:false});
  return k.spacing;
}
function spawnBolts(z){
  const x0=rng()*1.2-0.6, x1=rng()*1.2-0.6;
  for(let i=0;i<5;i++) picks.push({z:z+i*1.3,x:x0+(x1-x0)*(i/4),taken:false});
}
function ensureCourse(){
  while(nextZ<p.z+LEAD+6){ const sp=spawnRow(nextZ); nextZ+=sp+rng()*1.5; }
  while(nextBolt<p.z+LEAD+6){ if(rng()<knobs(nextBolt).boltRate) spawnBolts(nextBolt); nextBolt+=11+rng()*8; }
}

/* ---------------- telemetry (training data for Phase 2) ---------------- */
const TEL_CAP=4096;
const telem=[]; let telemN=0;
const events=[]; let eventsN=0;
const steerHist=new Array(12).fill(0);
function telRow(row,outcome,extra){
  telem[telemN%TEL_CAP]=Object.assign({t:perf,z:+row.z.toFixed(1),type:row.obs[0].type,
    xs:row.obs.map(o=>+o.x.toFixed(2)),px:+p.x.toFixed(2),gap:+gap.toFixed(1),outcome},extra||{});
  telemN++;
}
function evLog(type,data){ events[eventsN%TEL_CAP]=Object.assign({t:perf,type,z:+p.z.toFixed(1)},data); eventsN++; }
function telExport(){
  const blob=new Blob([JSON.stringify({seed:SEED,dist:Math.floor(p.z),steerHist,records:telem,events})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`boulder-rush-telemetry-${SEED}.json`; a.click(); URL.revokeObjectURL(a.href);
}
let copiedT=0;
function copySeed(){
  let s; try{const u=new URL(location.href);u.searchParams.set("seed",String(SEED));u.hash="";s=u.toString();}catch(e){s="?seed="+SEED;}
  const done=()=>{copiedT=160;};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done,()=>{try{prompt("copy this link:",s);}catch(e){} done();});
  else { try{prompt("copy this link:",s);}catch(e){} done(); }
}

/* ---------------- agent play loop ----------------
   The engine's second consumer (the renderer is the first): a policy
   plays through the SAME verbs a human has — observe → act → step.
   Nothing here exposes internals a player couldn't see. Harness bots
   are required to play through this, and Phase-2 self-play training
   taps the same loop. */
const play={
  observe(){
    return {
      dist:+p.z.toFixed(1), px:+p.x.toFixed(3), tx:+p.tx.toFixed(3),
      spd:+spd.toFixed(3), gap:+gap.toFixed(2), heat:+heat.toFixed(2),
      air:p.air, stumble:p.stumble, dead:p.dead, lunge:lungeState,
      ahead:rows.filter(r=>r.z-p.z>-0.5&&r.z-p.z<=LEAD)
        .map(r=>({rel:+(r.z-p.z).toFixed(2),obs:r.obs.map(o=>({type:o.type,x:o.x,w:o.w}))}))
        .sort((a,b)=>a.rel-b.rel),
      bolts:picks.filter(k=>!k.taken&&k.z-p.z>0&&k.z-p.z<=LEAD)
        .map(k=>({rel:+(k.z-p.z).toFixed(2),x:k.x})),
    };
  },
  act(a){
    if(a&&typeof a.steer==="number") p.tx=Math.max(-1,Math.min(1,a.steer));
    if(a&&a.jump) jumpQueued=true;
  },
  step(n){ if(!started)started=true; for(let i=0;i<(n||1);i++) tick(); },
};

/* ---------------- audio ---------------- */
let AC=null, rumbleGain=null;
function audio(){
  if(!AC){ try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const n=AC.sampleRate*2, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=90;
    rumbleGain=AC.createGain(); rumbleGain.gain.value=0;
    src.connect(f); f.connect(rumbleGain); rumbleGain.connect(AC.destination); src.start();
  }catch(e){} }
  if(AC&&AC.state==="suspended")AC.resume();
}
function tone(f0,f1,dur,type,vol){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,cut){
  if(!AC) return;
  const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
const sfx={
  jump:()=>tone(300,540,0.10,"square",0.08),
  land:()=>noiseHit(0.05,0.06,1800),
  pick:()=>tone(900,1350,0.06,"square",0.07),
  stumble:()=>{tone(360,90,0.28,"sawtooth",0.12); noiseHit(0.2,0.16,1400);},
  roar:()=>{tone(160,60,0.7,"sawtooth",0.16); noiseHit(0.5,0.14,600);},
  death:()=>{noiseHit(0.7,0.32,500); tone(100,30,0.8,"sine",0.2);},
};

/* ---------------- input (F1: pointer polled, applied same tick) ----------------
   Touch model (per-pointer, no shared booleans):
   - drag a finger  -> steer (the first finger to MOVE owns steering)
   - lone quick tap -> hop (fires on release, <220ms, <10px travel)
   - second finger  -> hop instantly, never steals steering
   Mouse: moving steers, click hops. */
let jumpQueued=false;
const touches=new Map();   // pointerId -> {x0,y0,t0,steering}
let steerId=null;
function canvasPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height};}
function steerFrom(mx){ p.tx=Math.max(-1,Math.min(1,(mx-CX)/hwOf(PLAYER_Y))); }
const SHARE_BTN={x:CX-140,y:VH/2+150,w:280,h:46};
const PAUSE_BTN={x:VW-58,y:16,w:42,h:42};
function togglePause(){ if(started&&!p.dead){ paused=!paused; if(rumbleGain)rumbleGain.gain.value=0; } }
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&started&&!p.dead) paused=true; });
cv.addEventListener("pointermove",e=>{
  if(paused) return;
  if(e.pointerType==="mouse"){ steerFrom(canvasPos(e).x); return; }
  const t=touches.get(e.pointerId); if(!t) return;
  const pos=canvasPos(e);
  if(!t.steering&&Math.abs(pos.x-t.x0)+Math.abs(pos.y-t.y0)>10&&(steerId===null||steerId===e.pointerId)){ t.steering=true; steerId=e.pointerId; }
  if(t.steering&&steerId===e.pointerId) steerFrom(pos.x);
},{passive:false});
cv.addEventListener("pointerdown",e=>{
  audio(); const pos=canvasPos(e);
  if(!started){ started=true; return; }
  if(p.dead){
    if(pos.x>=SHARE_BTN.x&&pos.x<=SHARE_BTN.x+SHARE_BTN.w&&pos.y>=SHARE_BTN.y&&pos.y<=SHARE_BTN.y+SHARE_BTN.h){ copySeed(); return; }
    location.reload(); return;
  }
  if(paused){ paused=false; return; }                        // any tap resumes
  if(pos.x>=PAUSE_BTN.x-8&&pos.x<=PAUSE_BTN.x+PAUSE_BTN.w+8&&pos.y>=PAUSE_BTN.y-8&&pos.y<=PAUSE_BTN.y+PAUSE_BTN.h+8){ togglePause(); return; }
  if(e.pointerType==="mouse"){ jumpQueued=true; return; }    // click = hop; mousemove already steers
  if(touches.size>=1){ jumpQueued=true; return; }            // second finger = hop, instantly
  touches.set(e.pointerId,{x0:pos.x,y0:pos.y,t0:performance.now(),steering:false});
  e.preventDefault();
},{passive:false});
function upT(e){
  const t=touches.get(e.pointerId);
  if(t){
    if(!t.steering&&performance.now()-t.t0<220&&started&&!p.dead&&!paused) jumpQueued=true;  // lone tap = hop
    touches.delete(e.pointerId);
    if(steerId===e.pointerId) steerId=null;
  }
}
cv.addEventListener("pointerup",upT); cv.addEventListener("pointercancel",upT);
const keys={l:false,r:false};
addEventListener("keydown",e=>{
  audio();
  if(e.key===" "||e.key==="w"||e.key==="W"||e.key==="ArrowUp"){ if(!started)started=true; else if(p.dead)location.reload(); else if(paused)paused=false; else jumpQueued=true; e.preventDefault(); }
  if(e.key==="p"||e.key==="P"||e.key==="Escape") togglePause();
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") keys.l=true;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") keys.r=true;
  if(e.key==="r"||e.key==="R"){ if(p.dead||started) location.reload(); }
  if(e.key==="t"||e.key==="T") telExport();
  if(e.key==="c"||e.key==="C") copySeed();
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") keys.l=false;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") keys.r=false;
});

/* ---------------- boulder policy ----------------
   THE call site: heuristic now, learned model later, same signature.
   Contract (F-floors): without a stumble in the last STUMBLE_WIN
   frames the gap never drops below GAP_FLOOR; a catch (gap<=CATCH)
   is only reachable through compounded recent stumbles; every lunge
   is telegraphed by ROAR_T frames of roar before the gap closes. */
function boulderPolicy(st){
  const recent=perf-lastStumble<STUMBLE_WIN;
  if(st.lungeState===1) return (spd-bSpd)*0.25;            // roaring: HOLD the gap — the telegraph never cheats
  if(st.lungeState===2) return +0.010;                     // lunging: close hard
  if(st.lungeState===3) return -0.008;                     // retreating
  if(!recent&&st.gap<GAP_FLOOR) return -0.006;             // fairness floor
  /* stumble heat compounds: one mistake stings, a chain is fatal.
     Standing still (stumbling every row) is death in ~15s; running
     clean bleeds the heat off and the target relaxes back. */
  const target=Math.max(0.8,Math.max(8,GAP0-6*intensity(p.z))-heat*4.5);
  return st.gap>target?+0.0035:-0.0025;
}

/* ---------------- sim tick (60Hz) ---------------- */
function stumble(kind,dur){
  if(p.invuln>0||p.dead) return;
  p.stumble=dur; p.invuln=INVULN_T; lastStumble=perf;
  heat=Math.min(6,heat+1);
  bSpd=Math.max(bSpd,spd+0.09);      // the pounce: a mistake is punished within 250ms (touchstone #2)
  shake=Math.max(shake,7); sfx.stumble();
  evLog("stumble",{kind});
  for(let i=0;i<10;i++) parts.push({x:CX+p.x*hwOf(PLAYER_Y)+(Math.random()*30-15),y:PLAYER_Y+(Math.random()*16-8),vx:Math.random()*3-1.5,vy:-Math.random()*3,life:22,max:22,c:"#c9a25a",sz:3});
}
function tick(){
  if(copiedT>0)copiedT--;
  if(!started||p.dead||paused){ if(rumbleGain&&paused)rumbleGain.gain.value=0; return; }
  perf++;
  if(perf-lastStumble>180&&heat>0) heat=Math.max(0,heat-1/240);   // clean running bleeds the heat off

  /* ---- steering (F1/F2: exponential approach, no overshoot) ---- */
  if(keys.l) p.tx=Math.max(-1,p.tx-0.045);
  if(keys.r) p.tx=Math.min(1,p.tx+0.045);
  p.x+=(p.tx-p.x)*STEER_K;
  if(perf%30===0){ const b=Math.min(11,Math.floor((p.x+1)/2*12)); steerHist[b]++; }

  /* ---- jump (F2: buffered fixed arc) ---- */
  if(jumpQueued){ p.buf=JUMP_BUF; jumpQueued=false; }
  else if(p.buf>0) p.buf--;
  if(p.buf>0&&p.air===0&&p.stumble===0){ p.air=JUMP_T; p.buf=0; sfx.jump(); }
  if(p.air>0){ p.air--; if(p.air===0) sfx.land(); }

  /* ---- run speed ---- */
  const targetSpd=SPD0+(SPD_MAX-SPD0)*intensity(p.z);
  if(p.stumble>0){ p.stumble--; spd+=((targetSpd*0.45)-spd)*0.3; }
  else spd+=(targetSpd-spd)*0.02;
  if(p.invuln>0) p.invuln--;
  p.z+=spd; p.anim+=spd;

  /* ---- boulder (F4/F5: the only killer) ---- */
  if(lungeState===0&&perf>=nextLunge&&gap>10&&perf-lastStumble>STUMBLE_WIN){
    lungeState=1; lungeT=ROAR_T; sfx.roar(); shake=Math.max(shake,5); evLog("roar",{gap:+gap.toFixed(1)});
  }
  if(lungeState===1){ if(--lungeT<=0){ lungeState=2; lungeT=60; evLog("lunge",{gap:+gap.toFixed(1)}); } }
  else if(lungeState===2){ if(--lungeT<=0||gap<=LUNGE_GAP){ lungeState=3; lungeT=120; bSpd=Math.min(bSpd,spd-0.02); } }  // no overshoot past the floor
  else if(lungeState===3){ if(--lungeT<=0||gap>=12){ lungeState=0; nextLunge=perf+1200+Math.floor(rng()*600); } }
  bSpd+=boulderPolicy({gap,lungeState});
  bSpd=Math.max(spd-0.10,Math.min(spd+0.12,bSpd));
  gap+=spd-bSpd;
  roll+=bSpd;
  if(gap<=CATCH){
    p.dead=true; sfx.death(); shake=18;
    if(rumbleGain)rumbleGain.gain.value=0;
    best=Math.max(best,Math.floor(p.z)); try{localStorage.setItem("boulder-rush-best",String(best));}catch(e){}
    evLog("death",{cause:"boulder",dist:Math.floor(p.z),bolts});
    return;
  }
  if(rumbleGain) rumbleGain.gain.value=Math.min(0.22,Math.max(0,(16-gap)/16*0.22));
  shake=Math.max(shake,Math.max(0,(9-gap))*0.5);

  /* ---- course ---- */
  ensureCourse();
  for(let i=rows.length-1;i>=0;i--){
    const row=rows[i], rel=row.z-p.z;
    if(!row.passed&&rel<0.5&&rel>-0.5){
      const airborne=p.air>0&&p.air<=JUMP_T-AIR_LO&&p.air>=JUMP_T-AIR_HI;
      let hit=null, minClear=9;
      for(const o of row.obs){
        const clear=Math.abs(p.x-o.x)-(o.w+PW)/2;
        if(clear<minClear)minClear=clear;
        if(clear<0){ if(o.type==="totem"||!airborne) hit=o; }
      }
      if(rel<0||hit){
        row.passed=true;
        if(hit){ stumble(hit.type,hit.type==="crack"?PIT_STUMBLE_T:STUMBLE_T); telRow(row,"stumble",{ob:hit.type}); }
        else telRow(row,minClear<0.09||(minClear<9&&airborne&&p.air>=JUMP_T-AIR_HI&&p.air<=JUMP_T-AIR_HI+3)?"near":"clean",{clear:+minClear.toFixed(2)});
      }
    }
    if(row.z-p.z<-BEHIND-4) rows.splice(i,1);
    else if(!row.crushed&&row.z-p.z<-gap){ row.crushed=true;
      for(let j=0;j<6;j++) parts.push({x:CX+(row.obs[0].x)*hwOf(yOf(row.z-p.z))+(Math.random()*24-12),y:yOf(row.z-p.z),vx:Math.random()*2-1,vy:-Math.random()*2.5,life:18,max:18,c:"#8f9aa8",sz:2.5});
    }
  }
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i], rel=k.z-p.z;

    if(rel<-gap+0.5||rel<-BEHIND-2) picks.splice(i,1);   // the boulder eats what you skipped

}

/* ---------------- render ---------------- */
function drawCanyon(){

  ctx.fillStyle=hg; ctx.fillRect(0,HORIZON-26,VW,60);

  ctx.fillStyle="#0c1019";

    const x=(i*53+((i*97)%19))%(VW+40)-20;
    ctx.fillRect(x,HORIZON-h,w,h);

  // ground plane beyond the causeway
  ctx.fillStyle="#10151f"; ctx.fillRect(0,HORIZON,VW,VH-HORIZON);

  for(let side=-1;side<=1;side+=2){
    ctx.fillStyle="#0d1119";
    ctx.beginPath();
    ctx.moveTo(CX+side*(hwOf(HORIZON)+18),HORIZON);
    for(let i=1;i<=12;i++){

      ctx.lineTo(CX+side*(hwOf(y)+26+((y-HORIZON)/(BOTTOM-HORIZON))*90),y);

/* streaming edge scenery — every element is a pure function of its

function drawScenery(){

    if(rel>LEAD+4||rel<-BEHIND) continue;

      ctx.fillStyle=`rgba(127,216,232,${0.35+0.25*Math.sin(perf/14+k)})`;

}
function railPath(side){
  ctx.beginPath();
  for(let i=0;i<=26;i++){
    const rel=LEAD+2-(LEAD+2+BEHIND)*(i/26), y=yOf(rel);
    const x=CX+side*hwOf(y);
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
}
function drawRoad(){
  // slate causeway — one opaque fill, no seam artifacts; darker up-slope,
  // lighter toward the camera = light falling on the near face of the hill
  const slope=ctx.createLinearGradient(0,HORIZON,0,BOTTOM);
  slope.addColorStop(0,"#131a28"); slope.addColorStop(0.5,"#1b2230"); slope.addColorStop(1,"#242e42");
  ctx.fillStyle=slope;
  ctx.beginPath();
  ctx.moveTo(CX-hwOf(HORIZON),HORIZON); ctx.lineTo(CX+hwOf(HORIZON),HORIZON);
  ctx.lineTo(CX+hwOf(BOTTOM),BOTTOM); ctx.lineTo(CX-hwOf(BOTTOM),BOTTOM);
  ctx.closePath(); ctx.fill();
  // transverse glow lines every 4m — continuous y from fractional rel, so
  // they slide smoothly instead of phasing (strokes, not alpha quads)
  for(let k=0;k<14;k++){
    const zl=Math.floor((p.z-BEHIND)/4)*4+k*4, rel=zl-p.z;
    if(rel>LEAD||rel<-BEHIND) continue;
    const y=yOf(rel), q=(y-HORIZON)/(VH-HORIZON);
    ctx.strokeStyle=`rgba(127,216,232,${0.04+0.10*q})`;
    ctx.lineWidth=Math.max(1,2.6*scaleOf(y));
    ctx.beginPath(); ctx.moveTo(CX-hwOf(y),y); ctx.lineTo(CX+hwOf(y),y); ctx.stroke();
  }
  // neon edge rails: glow pass + core pass
  for(let side=-1;side<=1;side+=2){
    railPath(side);
    ctx.strokeStyle="rgba(127,216,232,0.12)"; ctx.lineWidth=7; ctx.stroke();
    railPath(side);
    ctx.strokeStyle="rgba(127,216,232,0.55)"; ctx.lineWidth=2.5; ctx.stroke();
  }
  // darkening under the boulder = proximity read on the road itself (F4)
  const by=yOf(-gap);
  const g2=ctx.createLinearGradient(0,by,0,Math.min(PLAYER_Y,by+160));
  g2.addColorStop(0,"rgba(6,8,12,0.60)"); g2.addColorStop(1,"rgba(6,8,12,0)");
  ctx.fillStyle=g2; ctx.fillRect(0,by-10,VW,170);
}
function drawObstacle(row){
  const rel=row.z-p.z, y=yOf(rel), s=scaleOf(y), hw=hwOf(y);
  for(const o of row.obs){
    const x=CX+o.x*hw, w=o.w*hw*0.5;
    if(o.type==="rock"){
      // slag chunk
      ctx.fillStyle="#4a5568"; ctx.beginPath(); ctx.ellipse(x,y-10*s,w,16*s,0,0,7); ctx.fill();
      ctx.fillStyle="#5e6d84"; ctx.beginPath(); ctx.ellipse(x-w*0.25,y-16*s,w*0.5,9*s,0,0,7); ctx.fill();
      ctx.fillStyle="rgba(127,216,232,0.35)"; ctx.fillRect(x-w*0.1,y-20*s,w*0.22,3*s);
    } else if(o.type==="wall"){

      ctx.fillStyle="#3d4a5c"; ctx.fillRect(CX-hw,y-22*s,hw*2,5*s);
      const n=Math.max(4,Math.floor(hw/26));
      for(let i=0;i<n;i++){ ctx.fillStyle=i%2?"#e8a33d":"#20262f"; ctx.fillRect(CX-hw+i*(hw*2/n),y-14*s,hw*2/n,8*s); }
    } else if(o.type==="crack"){

      ctx.fillStyle="#0a0e14"; ctx.beginPath();

      ctx.fillStyle="#2b3442"; ctx.fillRect(x-w*0.55,y-58*s,w*1.1,58*s);

}
function drawBolt(k){
  const rel=k.z-p.z, y=yOf(rel), s=scaleOf(y), hw=hwOf(y);
  const x=CX+k.x*hw, bob=Math.sin((perf+k.z*10)/9)*3*s;

}
function drawBoulder(){
  const y=yOf(-gap), s=scaleOf(y);

  const prox=Math.max(0,(14-gap)/14), r=(215+150*prox)*s;
  const x=CX+Math.sin(roll*0.13)*8*s;
  // the sphere RESTS on the road: bottom edge at its contact line, mass
  // rising up-screen — it must never spill over the track toward the player

  // dust kicked up at the contact line
  ctx.fillStyle="rgba(90,105,130,0.28)";
  ctx.beginPath(); ctx.ellipse(x,y+2,r*0.62,r*0.10,0,0,7); ctx.fill();
  // iron-slate body
  const grad=ctx.createRadialGradient(x-r*0.35,cy-r*0.35,r*0.15,x,cy,r);
  grad.addColorStop(0,"#525f75"); grad.addColorStop(0.55,"#39424e"); grad.addColorStop(0.85,"#252c38"); grad.addColorStop(1,"#141922");
  ctx.fillStyle=grad;

  ctx.strokeStyle="rgba(127,216,232,0.14)"; ctx.lineWidth=Math.max(2,5*s);
  ctx.beginPath(); ctx.arc(x,cy,r*0.985,Math.PI+0.5,Math.PI*2-0.5); ctx.stroke();

  const hot=Math.min(1,Math.max(0,(14-gap)/14));
  ctx.strokeStyle=`rgba(232,163,61,${0.30+0.5*hot})`; ctx.lineWidth=Math.max(1.5,4*s);

  }
  ctx.strokeStyle="rgba(16,20,28,0.65)"; ctx.lineWidth=Math.max(1,2.5*s);

}

    ctx.font="16px monospace"; ctx.fillStyle= Math.floor(p.z)>=best&&best>0?"#7fe8a3":"#9aa5b1";
    ctx.fillText(Math.floor(p.z)>=best?`NEW BEST`:`best ${best}m`,CX,VH/2+2);
    ctx.fillStyle="#9aa5b1"; ctx.font="15px monospace";
    ctx.fillText("tap / R — run again",CX,VH/2+58);
    const hot=copiedT>0;
    ctx.fillStyle= hot?"rgba(127,232,163,0.18)":"rgba(127,216,232,0.14)";
    ctx.fillRect(SHARE_BTN.x,SHARE_BTN.y,SHARE_BTN.w,SHARE_BTN.h);
    ctx.strokeStyle= hot?"#7fe8a3":"#7fd8e8"; ctx.lineWidth=2;
    ctx.strokeRect(SHARE_BTN.x,SHARE_BTN.y,SHARE_BTN.w,SHARE_BTN.h);
    ctx.fillStyle= hot?"#7fe8a3":"#7fd8e8"; ctx.font="bold 16px monospace";
    ctx.fillText(hot?"link copied ✓":"send this run to a friend ⧉",CX,SHARE_BTN.y+29);
  }
}

/* ---------------- loop (F3: fixed timestep) ---------------- */
ensureCourse();
let acc=0,last=performance.now();
function frame(now){
  let dt=now-last; last=now;
  if(dt>100)dt=100;
  acc+=dt;
  while(acc>=1000/60){ tick(); acc-=1000/60; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
