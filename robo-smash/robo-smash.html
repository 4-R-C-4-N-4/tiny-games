<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROBO-SMASH — feel-first prototype</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;height:100%;overflow:hidden;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0b0e14;image-rendering:auto;max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
"use strict";
/* ============================================================
   ROBO-SMASH — a Crash-style side-scroller movement prototype.

   THE FEEL CONTRACT (non-negotiable, tune everything else around it):
   C1. Zero perceived input latency. Fixed 60Hz sim, input polled
       every tick, edge-detected. Nothing waits for animation.
   C2. Snappy, "jerky" ground movement (original PS1 Crash, not the
       remake's fluid/floaty rework). Max run speed in ~6 frames,
       full stop in ~6 frames.
   C3. Variable jump height. Releasing jump cuts ascent. Never
       binary max-height jumps (the remake's cardinal sin).
   C4. Asymmetric gravity: lighter going up, heavier coming down.
       Reads as weighty, never floaty.
   C5. Coyote time (7f) + jump buffer (8f). Ledge deaths are the
       player's fault, never the sim's.
   C6. Spin is generous: big hitbox, crates offer ZERO resistance
       (you plow through, momentum preserved), works in air.
   C7. Air-spin = brief levitation (fall speed capped, gravity
       damped) — the "death tornado" hang. Balanced by spin heat:
       4 chained spins -> short overheat cooldown (original Crash's
       spin fatigue).
   C8. Bouncing on a crate breaks it and springs you; holding jump
       springs higher. Refreshes your double jump.
   C9. Juice on every impact: 2-3f hitstop, particles, small shake,
       squash & stretch. Death -> respawn loop under 1.5s.
   C10. Camera is calm: gentle lookahead, stable vertical — never
        make the player misjudge a jump.
   ============================================================ */

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const VW = 960, VH = 540, TILE = 48;

/* ---------------- level ---------------- */
const LW = 122, LH = 12;
const grid = Array.from({length: LH}, () => Array(LW).fill(" "));
function put(x, y, c) { if (x>=0&&x<LW&&y>=0&&y<LH) grid[y][x] = c; }
function ground(a, b) { for (let x=a; x<=b; x++){ put(x,10,"#"); put(x,11,"#"); } }

ground(0,25); ground(29,56); ground(62,80); ground(91,111); ground(116,121);
for (let y=7;y<=11;y++) put(121,y,"#");                 // endcap wall

// tutorial crates
put(8,9,"B"); put(9,9,"B"); put(9,8,"B");
// pyramid
put(18,9,"B");put(19,9,"B");put(20,9,"B");put(18,8,"B");put(19,8,"B");put(18,7,"B");
// after pit 1
put(31,9,"!");
put(34,9,"^"); put(35,9,"^");
put(38,9,"B");
// crusher corridor
put(44,4,"M"); put(48,4,"M"); put(52,4,"M");
put(46,9,"B"); put(50,9,"B");
// pit 2 crossing
put(58,8,"="); put(59,8,"="); put(59,7,"B");
// TNT cluster
put(66,9,"B"); put(67,9,"T"); put(68,9,"B"); put(67,8,"B");
put(72,9,"!");
// climb over pit 3
put(82,8,"=");put(83,8,"=");
put(85,6,"=");put(86,6,"=");
put(88,4,"=");put(89,4,"=");put(88,3,"B");
// gauntlet
put(94,4,"M");
put(96,9,"B");
put(97,9,"^");put(98,9,"^");
put(101,9,"!");
// crate wall — plow through it
put(104,7,"B");put(104,8,"B");put(104,9,"B");
put(105,7,"B");put(105,8,"B");put(105,9,"B");
put(107,9,"T");
// finale
put(118,9,"G");

/* ---------------- entities from grid ---------------- */
const boxes=[], crushers=[], checkpoints=[], spikes=[];
let goal=null, totalBoxes=0;
for (let y=0;y<LH;y++) for (let x=0;x<LW;x++){
  const c=grid[y][x], px=x*TILE, py=y*TILE;
  if (c==="B"||c==="T"){ boxes.push({x:px,y:py,w:TILE,h:TILE,tnt:c==="T",alive:true,fuse:-1,wob:0}); totalBoxes++; grid[y][x]=" "; }
  else if (c==="M"){
    let ty=y+1; while(ty<LH && grid[ty][x]!=="#") ty++;
    crushers.push({x:px,anchor:py,rest:py,max:ty*TILE - 40,head:py,state:0,t:60+((x*37)%50)});
    grid[y][x]=" ";
  }
  else if (c==="!"){ checkpoints.push({x:px,y:py,on:false}); grid[y][x]=" "; }
  else if (c==="^"){ spikes.push({x:px+4,y:py+26,w:TILE-8,h:22,dx:px,dy:py}); grid[y][x]=" "; }
  else if (c==="G"){ goal={x:px,y:py}; grid[y][x]=" "; }
}
function solidAt(tx,ty){ if(tx<0||tx>=LW) return true; if(ty<0||ty>=LH) return false; const c=grid[ty][tx]; return c==="#"||c==="="; }

/* ---------------- audio (tiny synth) ---------------- */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); }
function tone(f0,f1,dur,type,vol){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
}
function noiseHit(dur,vol,cut){
  if(!AC) return;
  const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cut;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination); s.start(t);
}
const sfx={
  jump:()=>tone(300,560,0.12,"square",0.10),
  djump:()=>tone(420,760,0.12,"square",0.10),
  spin:()=>{tone(180,90,0.16,"sawtooth",0.06); noiseHit(0.10,0.05,3000);},
  box:()=>{tone(700,260,0.08,"triangle",0.12); noiseHit(0.07,0.10,4500);},
  bounce:()=>tone(240,520,0.10,"triangle",0.10),
  tick:()=>tone(1100,1100,0.05,"square",0.07),
  boom:()=>{noiseHit(0.5,0.30,900); tone(120,40,0.5,"sine",0.20);},
  die:()=>{tone(400,60,0.45,"sawtooth",0.12); noiseHit(0.3,0.12,1200);},
  check:()=>{tone(520,520,0.09,"square",0.09); setTimeout(()=>tone(780,780,0.14,"square",0.09),90);},
  win:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,f,0.18,"square",0.10),i*110));},
  overheat:()=>tone(200,120,0.2,"square",0.06),
};

/* ---------------- input ---------------- */
const key={l:false,r:false,j:false,s:false};
let prevJ=false, prevS=false, jPressed=false, sPressed=false;
const KEYMAP={
  ArrowLeft:"l",a:"l",A:"l", ArrowRight:"r",d:"r",D:"r",
  " ":"j",w:"j",W:"j",ArrowUp:"j",
  j:"s",J:"s",k:"s",K:"s",x:"s",X:"s",Shift:"s"
};
addEventListener("keydown",e=>{ audio(); const k=KEYMAP[e.key]; if(k){key[k]=true; e.preventDefault();} if(e.key==="r"||e.key==="R") requestReset=true; });
addEventListener("keyup",e=>{ const k=KEYMAP[e.key]; if(k) key[k]=false; });

// touch buttons
let touchSeen=false;
const tbtn=[
  {id:"l", x:24,  y:VH-104, r:44, label:"◀"},
  {id:"r", x:128, y:VH-104, r:44, label:"▶"},
  {id:"s", x:VW-232, y:VH-104, r:48, label:"SPIN"},
  {id:"j", x:VW-108, y:VH-104, r:48, label:"JUMP"},
];
const pointers=new Map();
function canvasPos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*VW/r.width, y:(e.clientY-r.top)*VH/r.height}; }
function hitBtn(p){ for(const b of tbtn){ const dx=p.x-(b.x+b.r), dy=p.y-(b.y+b.r); if(dx*dx+dy*dy<=(b.r+14)*(b.r+14)) return b.id; } return null; }
function syncTouch(){ key.l=key.r=false; let j=false,s=false; for(const id of pointers.values()){ if(id==="l")key.l=true; if(id==="r")key.r=true; if(id==="j")j=true; if(id==="s")s=true;} key.j=j; key.s=s; }
cv.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse")return; audio(); touchSeen=true; const b=hitBtn(canvasPos(e)); if(b){pointers.set(e.pointerId,b); syncTouch();} e.preventDefault(); },{passive:false});
cv.addEventListener("pointermove",e=>{ if(!pointers.has(e.pointerId))return; const b=hitBtn(canvasPos(e)); pointers.set(e.pointerId,b); syncTouch(); },{passive:false});
function upT(e){ if(pointers.has(e.pointerId)){ pointers.delete(e.pointerId); syncTouch(); } }
cv.addEventListener("pointerup",upT); cv.addEventListener("pointercancel",upT);
cv.addEventListener("mousedown",audio);

/* ---------------- player + feel constants (C2–C7) ---------------- */
const ACCEL=0.85, AIR_ACCEL=0.50, FRICTION=0.76, MAXRUN=4.6;
/* C3 sustain model: modest impulse, low gravity WHILE jump is held,
   heavy gravity the instant you release (+ one-time velocity cut).
   Hold duration -> height is near-continuous, like PS1 Crash.
   Tap (~5f) clears ~1 tile; full hold clears ~2.5 tiles. */
const JUMP_V=-9.2, DJUMP_V=-8.4, SUSTAIN_G=0.34, RELEASE_G=0.92, GRAV_DOWN=0.84, MAXFALL=13, CUT=0.45;
const COYOTE=7, BUFFER=8;
const SPIN_T=20, SPIN_FALL=3.2, SPIN_GRAV=0.32, HEAT_MAX=4, OVERHEAT_T=55;

const p={x:2*TILE,y:8*TILE,w:30,h:42,vx:0,vy:0,face:1,grounded:false,
  coyote:0,buffer:0,jumps:0,jumpHeld:false,
  spin:0,heat:0,overheat:0,heatRelax:0,
  sx:1,sy:1,run:0,dead:0,win:false,spawn:{x:2*TILE,y:8*TILE}};
let deaths=0, broken=0, requestReset=false;
let shake=0, hitstop=0, flashT=0;
const parts=[], ghosts=[], fuses=[];

function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function spawnParts(x,y,n,cols,spd,life,grav){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=spd*(0.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:life*(0.6+Math.random()*0.7),max:life,c:cols[(Math.random()*cols.length)|0],g:grav,sz:2+Math.random()*4}); }
}

function breakBox(b,byExplosion){
  if(!b.alive) return;
  b.alive=false; broken++;
  if(b.tnt){ explode(b.x+24,b.y+24); return; }
  sfx.box();
  hitstop=Math.max(hitstop,2); shake=Math.max(shake,3);
  spawnParts(b.x+24,b.y+24,14,["#e8a33d","#c97b2d","#8a5320","#ffd98a"],4.5,26,0.25);
}
function explode(cx,cy){
  sfx.boom(); hitstop=Math.max(hitstop,6); shake=Math.max(shake,10); flashT=6;
  spawnParts(cx,cy,30,["#ff5d3a","#ffb03a","#fff1c9","#5a5a5a"],7,34,0.12);
  for(const b of boxes){ if(b.alive){ const dx=(b.x+24)-cx, dy=(b.y+24)-cy; if(dx*dx+dy*dy<110*110){ if(b.tnt&&b.fuse<0){b.fuse=12;} else breakBox(b,true); } } }
  if(!p.dead&&!p.win){ const dx=(p.x+p.w/2)-cx, dy=(p.y+p.h/2)-cy; if(dx*dx+dy*dy<85*85) kill(); }
}
function kill(){
  if(p.dead||p.win) return;
  p.dead=60; deaths++; sfx.die(); shake=8;
  spawnParts(p.x+p.w/2,p.y+p.h/2,26,["#7fd8e8","#9aa5b1","#3f4854","#ffd98a"],5.5,40,0.2);
}
function respawn(){
  p.x=p.spawn.x; p.y=p.spawn.y; p.vx=0; p.vy=0; p.spin=0; p.heat=0; p.overheat=0;
  p.jumps=0; p.dead=0; p.sx=1; p.sy=1;
  for(const c of crushers){ c.head=c.rest; c.state=0; c.t=60; }
  for(const b of boxes){ if(b.tnt) b.fuse=-1; }
}

/* solids near player (tiles + live crates) */
function collideRects(r){
  const out=[];
  const x0=Math.floor(r.x/TILE)-1, x1=Math.floor((r.x+r.w)/TILE)+1;
  const y0=Math.floor(r.y/TILE)-1, y1=Math.floor((r.y+r.h)/TILE)+1;
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)
    if(solidAt(tx,ty)) out.push({x:tx*TILE,y:ty*TILE,w:TILE,h:TILE,tile:true});
  for(const b of boxes) if(b.alive && Math.abs(b.x-r.x)<120 && Math.abs(b.y-r.y)<120) out.push(b);
  return out;
}

/* ---------------- sim tick (60Hz) ---------------- */
function tick(){
  jPressed = key.j && !prevJ;  sPressed = key.s && !prevS;
  prevJ=key.j; prevS=key.s;

  if(requestReset){ requestReset=false; if(p.win){location.reload();} else respawn(); }

  if(hitstop>0){ hitstop--; return; }   // C9: impact freeze (input still polled above)

  // particles / ghosts / fuses always run
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--; if(q.life<=0)parts.splice(i,1); }
  for(let i=ghosts.length-1;i>=0;i--){ ghosts[i].life--; if(ghosts[i].life<=0)ghosts.splice(i,1); }

  // crushers
  for(const c of crushers){
    if(c.state===0){ if(--c.t<=0){c.state=1; sfx.tick();} }
    else if(c.state===1){ c.head+=15; if(c.head>=c.max){c.head=c.max;c.state=2;c.t=22; shake=Math.max(shake,5); noiseHit(0.12,0.14,900); spawnParts(c.x+24,c.head+40,8,["#9aa5b1","#5a6673"],3.5,18,0.3);} }
    else if(c.state===2){ if(--c.t<=0)c.state=3; }
    else { c.head-=2.4; if(c.head<=c.rest){c.head=c.rest;c.state=0;c.t=70;} }
  }

  // TNT fuses
  for(const b of boxes){
    if(b.alive&&b.tnt&&b.fuse>0){
      b.fuse--;
      if(b.fuse%60===0&&b.fuse>0) sfx.tick();
      if(b.fuse<=0){ b.alive=false; broken++; explode(b.x+24,b.y+24); }
    }
  }

  if(p.win) return;
  if(p.dead>0){ p.dead--; if(p.dead===0) respawn(); return; }

  /* ---- horizontal (C2) ---- */
  const want=(key.r?1:0)-(key.l?1:0);
  if(want!==0){
    p.vx += want*(p.grounded?ACCEL:AIR_ACCEL);
    if(Math.abs(p.vx)>MAXRUN) p.vx=MAXRUN*Math.sign(p.vx);
    p.face=want;
    if(p.grounded){ p.run+=Math.abs(p.vx)*0.06; if(Math.random()<0.15&&Math.abs(p.vx)>3) parts.push({x:p.x+p.w/2-p.face*10,y:p.y+p.h-2,vx:-p.face*0.5,vy:-0.4,life:12,max:12,c:"#39424e",g:0,sz:2.5}); }
  } else {
    if(p.grounded){ p.vx*=FRICTION; if(Math.abs(p.vx)<0.3)p.vx=0; }
    else p.vx*=0.985;
  }

  /* ---- spin (C6, C7) ---- */
  p.heatRelax = p.grounded && p.spin===0 ? p.heatRelax+1 : 0;
  if(p.heatRelax>18) p.heat=0;
  if(p.overheat>0) p.overheat--;
  if(sPressed && p.spin===0 && p.overheat===0){
    p.spin=SPIN_T; p.heat++; sfx.spin();
    if(p.heat>=HEAT_MAX){ p.overheat=OVERHEAT_T; sfx.overheat(); }
  }
  if(p.spin>0){
    p.spin--;
    ghosts.push({x:p.x,y:p.y,face:p.face,life:10});
    const hb={x:p.x-16,y:p.y-4,w:p.w+32,h:p.h+8};
    for(const b of boxes) if(b.alive&&rectsOverlap(hb,b)){
      if(b.tnt){ b.alive=false; broken++; explode(b.x+24,b.y+24); }  // spinning TNT = instant boom, stay clear
      else breakBox(b);
    }
  }

  /* ---- jump (C3, C5) ---- */
  if(jPressed) p.buffer=BUFFER; else if(p.buffer>0) p.buffer--;
  if(p.coyote>0) p.coyote--;
  if(p.buffer>0){
    if(p.grounded||p.coyote>0){
      p.vy=JUMP_V; p.grounded=false; p.coyote=0; p.buffer=0; p.jumps=1; p.jumpHeld=true;
      p.sx=0.78; p.sy=1.24; sfx.jump();
    } else if(p.jumps<2){
      p.vy=DJUMP_V; p.jumps=2; p.buffer=0; p.jumpHeld=true;
      p.sx=0.8; p.sy=1.2; sfx.djump();
      spawnParts(p.x+p.w/2,p.y+p.h,8,["#7fd8e8","#cfeef5"],2.8,14,0.05);
    }
  }
  if(!key.j && p.jumpHeld){ p.jumpHeld=false; if(p.vy<-3) p.vy*=CUT; }  // C3

  /* ---- gravity (C4 + C7 hover) ---- */
  const spinningAir = p.spin>0 && !p.grounded;
  let g;
  if(p.vy<0) g = (p.jumpHeld && key.j) ? SUSTAIN_G : RELEASE_G;
  else g = GRAV_DOWN;
  if(spinningAir) g=SPIN_GRAV;
  p.vy+=g;
  const cap = spinningAir ? SPIN_FALL : MAXFALL;
  if(p.vy>cap) p.vy=cap;
  if(spinningAir && Math.random()<0.5)
    parts.push({x:p.x+p.w/2+(Math.random()*16-8),y:p.y+p.h,vx:0,vy:1.6,life:10,max:10,c:"#7fd8e8",g:0,sz:2});

  /* ---- move + collide ---- */
  // X
  p.x+=p.vx;
  for(const r of collideRects(p)){
    if(!rectsOverlap(p,r)) continue;
    if(!r.tile && p.spin>0){ if(r.tnt){r.alive=false;broken++;explode(r.x+24,r.y+24);} else breakBox(r); continue; }  // C6: plow through
    if(p.vx>0) p.x=r.x-p.w; else if(p.vx<0) p.x=r.x+r.w; else { p.x = (p.x+p.w/2)<(r.x+r.w/2) ? r.x-p.w : r.x+r.w; }
    p.vx=0;
  }
  // Y
  const wasBottom=p.y+p.h;
  p.y+=p.vy;
  let landed=false;
  for(const r of collideRects(p)){
    if(!rectsOverlap(p,r)) continue;
    if(p.vy>0){
      if(!r.tile && wasBottom<=r.y+10){                 // C8: crate bounce
        if(r.tnt){
          if(r.fuse<0){ r.fuse=180; sfx.tick(); }
          p.y=r.y-p.h; p.vy = key.j?-9.4:-7.8; p.jumps=1; p.sx=1.2;p.sy=0.8; sfx.bounce();
        } else {
          breakBox(r);
          p.y=r.y-p.h; p.vy = key.j?-9.4:-7.8; p.jumps=1; p.sx=1.2;p.sy=0.8; sfx.bounce();
        }
        p.jumpHeld=key.j;
        continue;
      }
      p.y=r.y-p.h; p.vy=0; landed=true;
    } else if(p.vy<0){
      if(!r.tile && p.spin>0){ if(r.tnt){r.alive=false;broken++;explode(r.x+24,r.y+24);} else breakBox(r); continue; }
      p.y=r.y+r.h; p.vy=0;
    }
  }
  const wasAir=!p.grounded;
  p.grounded=landed;
  if(landed){
    p.coyote=COYOTE; p.jumps=0;
    if(wasAir){ p.sx=1.28; p.sy=0.72; if(Math.abs(p.vx)>1||true) spawnParts(p.x+p.w/2,p.y+p.h,6,["#39424e","#5a6673"],2.2,12,0.15); }
  } else if(p.coyote===0 && p.jumps===0) p.jumps=1;      // walked off a ledge: keep double jump only

  // squash/stretch spring (C9)
  p.sx+=(1-p.sx)*0.18; p.sy+=(1-p.sy)*0.18;

  /* ---- hazards ---- */
  const pr={x:p.x+4,y:p.y+4,w:p.w-8,h:p.h-8};
  for(const s of spikes) if(rectsOverlap(pr,s)){ kill(); break; }
  for(const c of crushers){
    const body={x:c.x+4,y:c.anchor,w:TILE-8,h:c.head-c.anchor+40};
    if(c.head>c.rest+6 && rectsOverlap(pr,body)){ kill(); break; }
  }
  if(p.y>LH*TILE+80) kill();

  // checkpoints (C9: fast loop, generous saves)
  for(const cp of checkpoints){
    if(!cp.on && rectsOverlap(p,{x:cp.x,y:cp.y-TILE,w:TILE,h:TILE*2})){
      cp.on=true; p.spawn={x:cp.x+9,y:cp.y-6}; sfx.check();
      spawnParts(cp.x+24,cp.y+10,12,["#7fe8a3","#d7ffe6"],3,22,0.05);
    }
  }
  if(goal && rectsOverlap(p,{x:goal.x,y:goal.y-TILE,w:TILE,h:TILE*2})){ p.win=true; sfx.win(); }

  if(shake>0) shake*=0.86;
  if(flashT>0) flashT--;
}

/* ---------------- render ---------------- */
let camX=0, camY=36;
function draw(){
  // camera (C10)
  const tx=p.x+p.w/2-VW/2+p.face*70;
  camX+= (Math.max(0,Math.min(tx,LW*TILE-VW))-camX)*0.10;
  const ty=Math.max(0,Math.min(p.y-300,LH*TILE-VH));
  camY+=(ty-camY)*0.06;
  const ox=(Math.random()*2-1)*shake, oy=(Math.random()*2-1)*shake;

  // sky
  const sky=ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,"#101726"); sky.addColorStop(0.6,"#182236"); sky.addColorStop(1,"#241f2a");
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);

  // parallax scrap towers
  drawTowers(0.25,"#141b2a",300,120);
  drawTowers(0.5,"#1b2334",180,190);

  ctx.save(); ctx.translate(-camX+ox,-camY+oy);

  // tiles
  const x0=Math.floor(camX/TILE)-1, x1=Math.floor((camX+VW)/TILE)+1;
  for(let ty2=0;ty2<LH;ty2++)for(let tx2=Math.max(0,x0);tx2<=Math.min(LW-1,x1);tx2++){
    const c=grid[ty2][tx2]; if(c!=="#"&&c!=="=") continue;
    const X=tx2*TILE,Y=ty2*TILE;
    if(c==="#"){
      ctx.fillStyle="#2b3442"; ctx.fillRect(X,Y,TILE,TILE);
      ctx.fillStyle= solidAt(tx2,ty2-1)?"#252d3a":"#3d4a5c"; ctx.fillRect(X,Y,TILE,6);
      ctx.fillStyle="#222a36"; ctx.fillRect(X,Y+TILE-5,TILE,5);
      ctx.fillStyle="rgba(255,255,255,0.03)"; ctx.fillRect(X+ (tx2%2?6:22),Y+14,10,3);
    } else {
      ctx.fillStyle="#3a4657"; ctx.fillRect(X,Y+8,TILE,18);
      ctx.fillStyle="#55647a"; ctx.fillRect(X,Y+8,TILE,4);
      ctx.fillStyle="#232b38"; ctx.fillRect(X+6,Y+26,4,6); ctx.fillRect(X+TILE-10,Y+26,4,6);
    }
  }

  // spikes
  for(const s of spikes){
    ctx.fillStyle="#8f9aa8";
    for(let i=0;i<4;i++){ const bx=s.dx+2+i*11;
      ctx.beginPath(); ctx.moveTo(bx,s.dy+TILE); ctx.lineTo(bx+5.5,s.dy+22); ctx.lineTo(bx+11,s.dy+TILE); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle="#5e6875"; ctx.fillRect(s.dx,s.dy+TILE-4,TILE,4);
  }

  // checkpoints
  for(const cp of checkpoints){
    ctx.fillStyle="#5a6673"; ctx.fillRect(cp.x+21,cp.y-30,6,TILE+30);
    ctx.fillStyle=cp.on?"#7fe8a3":"#39424e";
    ctx.beginPath(); ctx.moveTo(cp.x+27,cp.y-30); ctx.lineTo(cp.x+52,cp.y-20); ctx.lineTo(cp.x+27,cp.y-10); ctx.closePath(); ctx.fill();
    if(cp.on){ ctx.fillStyle="rgba(127,232,163,0.15)"; ctx.beginPath(); ctx.arc(cp.x+24,cp.y-20,26+Math.sin(perf/12)*3,0,7); ctx.fill(); }
  }

  // goal
  if(goal){
    ctx.fillStyle="#5a6673"; ctx.fillRect(goal.x+20,goal.y-52,8,TILE+52);
    const gl=Math.sin(perf/8)*0.5+0.5;
    ctx.fillStyle=`rgba(232,163,61,${0.7+gl*0.3})`;
    ctx.beginPath(); ctx.moveTo(goal.x+28,goal.y-52); ctx.lineTo(goal.x+62,goal.y-38); ctx.lineTo(goal.x+28,goal.y-24); ctx.closePath(); ctx.fill();
  }

  // crushers
  for(const c of crushers){
    ctx.fillStyle="#242c38"; ctx.fillRect(c.x+14,c.anchor,20,c.head-c.anchor+6);
    ctx.fillStyle="#39424e"; ctx.fillRect(c.x+18,c.anchor,4,c.head-c.anchor+6);
    ctx.fillStyle="#4a5568"; ctx.fillRect(c.x+2,c.head,44,40);
    ctx.fillStyle="#39424e"; ctx.fillRect(c.x+2,c.head+32,44,8);
    for(let i=0;i<3;i++){ ctx.fillStyle=i%2?"#e8a33d":"#20262f"; ctx.fillRect(c.x+4+i*14,c.head+6,12,8); }
    ctx.fillStyle="#20262f"; ctx.fillRect(c.x+2,c.head,44,4);
  }

  // boxes
  for(const b of boxes){
    if(!b.alive) continue;
    if(b.tnt){
      ctx.fillStyle="#b8452e"; ctx.fillRect(b.x+3,b.y+3,42,42);
      ctx.fillStyle="#8f3322"; ctx.fillRect(b.x+3,b.y+3,42,6); ctx.fillRect(b.x+3,b.y+39,42,6);
      ctx.fillStyle="#ffe9c9"; ctx.font="bold 15px monospace"; ctx.textAlign="center";
      ctx.fillText(b.fuse>0?String(Math.ceil(b.fuse/60)):"TNT", b.x+24, b.y+30);
      if(b.fuse>0&&(b.fuse%20<10)){ ctx.fillStyle="rgba(255,120,60,0.25)"; ctx.fillRect(b.x,b.y,48,48); }
    } else {
      ctx.fillStyle="#c97b2d"; ctx.fillRect(b.x+3,b.y+3,42,42);
      ctx.fillStyle="#e8a33d"; ctx.fillRect(b.x+3,b.y+3,42,7);
      ctx.fillStyle="#8a5320"; ctx.fillRect(b.x+3,b.y+38,42,7);
      ctx.strokeStyle="#8a5320"; ctx.lineWidth=3;
      ctx.strokeRect(b.x+6,b.y+6,36,36);
      ctx.beginPath(); ctx.moveTo(b.x+6,b.y+6); ctx.lineTo(b.x+42,b.y+42); ctx.moveTo(b.x+42,b.y+6); ctx.lineTo(b.x+6,b.y+42); ctx.stroke();
    }
  }

  // spin ghosts
  for(const g of ghosts){
    ctx.globalAlpha=g.life/10*0.25;
    ctx.fillStyle="#7fd8e8"; ctx.fillRect(g.x-6,g.y+6,p.w+12,p.h-12);
    ctx.globalAlpha=1;
  }

  // particles
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life/q.max); ctx.fillStyle=q.c; ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz); }
  ctx.globalAlpha=1;

  if(!(p.dead>0)) drawRobot(p.x,p.y,p.face,p.sx,p.sy,p.spin>0,p.run,p.grounded,p.vy);

  // world hints
  ctx.fillStyle="rgba(210,220,235,0.5)"; ctx.font="14px monospace"; ctx.textAlign="left";
  ctx.fillText("◀ ▶ move · SPACE jump (tap short / hold high) · again in air = double jump", 60, 350);
  ctx.fillText("J / K = SPIN — breaks crates, hover-spins in the air", 60, 372);
  ctx.fillText("bounce on crates to break them ↑", 340, 300);
  ctx.restore();

  // screen flash
  if(flashT>0){ ctx.fillStyle=`rgba(255,240,220,${flashT/6*0.5})`; ctx.fillRect(0,0,VW,VH); }

  /* HUD */
  ctx.fillStyle="rgba(10,14,20,0.55)"; ctx.fillRect(14,12,196,64);
  ctx.fillStyle="#e8a33d"; ctx.font="bold 16px monospace"; ctx.textAlign="left";
  ctx.fillText(`CRATES ${broken} / ${totalBoxes}`, 26, 36);
  ctx.fillStyle="#9aa5b1"; ctx.font="13px monospace";
  ctx.fillText(`deaths ${deaths}   R restart`, 26, 58);
  // spin heat gauge
  ctx.fillStyle="rgba(10,14,20,0.55)"; ctx.fillRect(VW-150,12,136,40);
  ctx.fillStyle="#9aa5b1"; ctx.font="11px monospace"; ctx.fillText("GYRO", VW-140, 26);
  for(let i=0;i<HEAT_MAX;i++){
    ctx.fillStyle = p.overheat>0 ? (perf%20<10?"#b8452e":"#5a2a20") : (i<p.heat?"#7fd8e8":"#2b3442");
    ctx.fillRect(VW-140+i*26, 32, 20, 10);
  }

  // touch buttons
  if(touchSeen){
    ctx.font="bold 20px monospace"; ctx.textAlign="center";
    for(const b of tbtn){
      const active=[...pointers.values()].includes(b.id);
      ctx.fillStyle=active?"rgba(127,216,232,0.35)":"rgba(150,165,185,0.16)";
      ctx.beginPath(); ctx.arc(b.x+b.r,b.y+b.r,b.r,0,7); ctx.fill();
      ctx.fillStyle="rgba(230,240,250,0.8)";
      ctx.fillText(b.label,b.x+b.r,b.y+b.r+7);
    }
  }

  if(p.win){
    ctx.fillStyle="rgba(8,10,16,0.72)"; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign="center";
    ctx.fillStyle="#e8a33d"; ctx.font="bold 44px monospace"; ctx.fillText("LEVEL CLEAR", VW/2, VH/2-40);
    ctx.fillStyle="#dfe8f2"; ctx.font="20px monospace";
    ctx.fillText(`crates ${broken} / ${totalBoxes}${broken===totalBoxes?"  — ALL CLEAR!":""}`, VW/2, VH/2+6);
    ctx.fillText(`deaths ${deaths}`, VW/2, VH/2+36);
    ctx.fillStyle="#9aa5b1"; ctx.font="15px monospace"; ctx.fillText("press R to run it back", VW/2, VH/2+78);
  }
}

function drawTowers(f,col,step,hmax){
  ctx.fillStyle=col;
  const off=(camX*f)%step;
  for(let x=-off-step;x<VW+step;x+=step){
    const seed=Math.floor((x+camX*f)/step);
    const h=80+((seed*2654435761)>>>8)%hmax;
    const w=60+((seed*40503)>>>4)%90;
    ctx.fillRect(x,VH-h-60,w,h+60);
    ctx.fillRect(x+w*0.3,VH-h-92,10,34);
  }
}

function drawRobot(x,y,face,sx,sy,spin,run,grounded,vy){
  ctx.save();
  const cx=x+p.w/2, bot=y+p.h;
  ctx.translate(cx,bot); ctx.scale(sx,sy); ctx.translate(-p.w/2,-p.h);
  if(spin){
    // gyro blur
    ctx.fillStyle="rgba(127,216,232,0.20)";
    ctx.beginPath(); ctx.ellipse(p.w/2,p.h/2,34,22,0,0,7); ctx.fill();
    ctx.strokeStyle="rgba(127,216,232,0.8)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(p.w/2,p.h/2,30,16,Math.sin(perf*0.9)*0.4,0,7); ctx.stroke();
    ctx.fillStyle="#5a6673"; ctx.fillRect(p.w/2-8,6,16,30);
    ctx.fillStyle="#7fd8e8"; ctx.fillRect(p.w/2-6,12,12,6);
    ctx.restore(); return;
  }
  const legA = grounded ? Math.sin(run*6)*6 : 4;
  const legB = grounded ? -Math.sin(run*6)*6 : -2;
  // legs
  ctx.fillStyle="#39424e";
  ctx.fillRect(4, 28, 9, 14+legA*0.4);
  ctx.fillRect(17, 28, 9, 14+legB*0.4);
  ctx.fillStyle="#20262f";
  ctx.fillRect(2+ (grounded?legA*0.4:0), 40, 12, 4);
  ctx.fillRect(16+(grounded?legB*0.4:0), 40, 12, 4);
  // torso
  ctx.fillStyle="#4a5568"; ctx.fillRect(2,12,26,18);
  ctx.fillStyle="#5a6673"; ctx.fillRect(2,12,26,5);
  ctx.fillStyle="#e8a33d"; ctx.fillRect(face>0?20:6, 20, 4,4);   // chest light
  // arm
  ctx.fillStyle="#39424e"; ctx.fillRect(face>0?24:-2, 16, 8,12);
  // head
  ctx.fillStyle="#5a6673"; ctx.fillRect(4,-2,22,14);
  ctx.fillStyle="#20262f"; ctx.fillRect(face>0?10:4, 1, 16,8);
  ctx.fillStyle="#7fd8e8"; ctx.fillRect(face>0?13:7, 3, 10,4);   // visor
  // antenna
  ctx.fillStyle="#9aa5b1"; ctx.fillRect(13,-8,3,7);
  ctx.fillStyle= vy<-1 ? "#7fe8a3" : "#e8a33d"; ctx.fillRect(12,-11,5,4);
  ctx.restore();
}

/* ---------------- loop ---------------- */
let perf=0, acc=0, last=performance.now();
function frame(now){
  let dt=now-last; last=now;
  if(dt>100) dt=100;
  acc+=dt;
  while(acc>=1000/60){ tick(); perf++; acc-=1000/60; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
